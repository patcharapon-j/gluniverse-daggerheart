<!doctype html>
<meta charset="utf-8">
<title>frame test</title>
<style>
  body{background:#111;color:#ddd;font:12px monospace;padding:20px}
  .frame{position:relative;width:288px;height:180px;overflow:hidden;background:#20242b;margin:6px 0 18px}
  h3{margin:14px 0 2px;font-size:12px}

  /* A — today: background cover on a frame-sized layer, transform pan */
  .a .img{position:absolute;inset:0;background:var(--art) center 22%/cover;
    transform:translate(var(--fx,0%),var(--fy,0%)) scale(var(--fz,1))}

  /* B — img with object-fit:cover + overflow:visible, wrapper carries the pan */
  .b .img{position:absolute;inset:0;
    transform:translate(var(--fx,0%),var(--fy,0%)) scale(var(--fz,1))}
  .b .img img{position:absolute;inset:0;width:100%;height:100%;
    object-fit:cover;object-position:50% 22%;overflow:visible}

  /* C — img sized by min-width/min-height cover trick */
  .c .img{position:absolute;inset:0;
    transform:translate(var(--fx,0%),var(--fy,0%)) scale(var(--fz,1))}
  .c .img img{position:absolute;left:50%;top:22%;translate:-50% -22%;
    width:auto;height:auto;min-width:100%;min-height:100%;max-width:none;max-height:none}
</style>
<script>
  // 200 x 400 image, banded so the crop is obvious
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="200" height="400">
    <rect width="200" height="400" fill="#245"/>
    ${[0,1,2,3,4,5,6,7].map(i=>`<rect y="${i*50}" width="200" height="50" fill="hsl(${i*40} 70% ${20+i*7}%)"/>
      <text x="8" y="${i*50+30}" fill="#fff" font-size="22" font-family="monospace">${i}</text>`).join('')}
    <rect x="1" y="1" width="198" height="398" fill="none" stroke="#fff" stroke-width="2"/>
  </svg>`;
  const url = 'data:image/svg+xml;utf8,' + encodeURIComponent(svg);
  addEventListener('DOMContentLoaded', () => {
    document.querySelectorAll('.img').forEach(el => el.style.setProperty('--art', `url("${url}")`));
    document.querySelectorAll('.img img').forEach(el => el.src = url);
  });
</script>

<div id="out"></div>
<h3>A — current (background cover). pan y -40%</h3>
<div class="frame a"><div class="img" style="--fy:-40%"></div></div>
<h3>A — neutral</h3>
<div class="frame a"><div class="img"></div></div>

<h3>B — object-fit cover + overflow visible. pan y -40%</h3>
<div class="frame b"><div class="img" style="--fy:-40%"><img></div></div>
<h3>B — neutral</h3>
<div class="frame b"><div class="img"><img></div></div>

<h3>C — min-width/min-height. pan y -40%</h3>
<div class="frame c"><div class="img" style="--fy:-40%"><img></div></div>
<h3>C — neutral</h3>
<div class="frame c"><div class="img"><img></div></div>

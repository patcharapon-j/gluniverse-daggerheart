<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DH · port check</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;600;700&family=Google+Sans+Text:wght@400;500;600;700&family=Google+Sans+Code:wght@400;500;600;700&display=swap" rel="stylesheet">

<!-- The *ported* sheets, exactly as system.json loads them. If the
     :root → .dh rewrite broke anything, it breaks here. -->
<link rel="stylesheet" href="/styles/tokens.css">
<link rel="stylesheet" href="/styles/frame.css">
<link rel="stylesheet" href="/styles/mark.css">
<link rel="stylesheet" href="/styles/gem.css">
<link rel="stylesheet" href="/styles/track.css">
<link rel="stylesheet" href="/styles/pool.css">
<link rel="stylesheet" href="/styles/tile.css">
<link rel="stylesheet" href="/styles/card.css">
<link rel="stylesheet" href="/styles/roll.css">
<link rel="stylesheet" href="/styles/swap.css">
<link rel="stylesheet" href="/styles/sheet.css">
<link rel="stylesheet" href="/styles/plate.css">
<link rel="stylesheet" href="/styles/dlg.css">
<link rel="stylesheet" href="/styles/make.css">
<!-- Last, exactly as system.json loads it: the Svelte components' own styles.
     Leaving it out is how the first pass missed that the sheet's stack is not
     the study page's stack. -->
<link rel="stylesheet" href="/styles/daggerheart-components.css">

<style>
  /* This page stands in for the Foundry document, which is the one thing the
     ported sheets no longer bring with them — they style a subtree now. */
  html,body{margin:0}
  body{background:radial-gradient(130% 100% at 50% -20%,#191d24 0%,#0d1013 55%,#060709 100%) fixed;
       font-family:"Google Sans Text",system-ui,sans-serif;padding:0 0 80px}
  .dh{--art:url("/design/assets/art-sample-01.png")}
  .hd{position:sticky;top:0;z-index:9;background:rgba(10,12,15,.9);backdrop-filter:blur(14px);
      border-bottom:1px solid #22272f;padding:11px 26px;display:flex;gap:20px;align-items:center}
  .hd b{font:700 10px/1 "Google Sans Code",monospace;letter-spacing:.2em;color:#7d8794;text-transform:uppercase}
  .hd label{font:400 12px/1 "Google Sans Text",sans-serif;color:#9aa3ae;display:flex;gap:6px;align-items:center}
  h2{font:600 14px/1 "Google Sans",sans-serif;color:#fff;margin:40px 26px 14px}
  h2 span{display:block;font:600 9.5px/1 "Google Sans Code",monospace;letter-spacing:.22em;
          color:#d4a72c;margin-bottom:8px}
  .stage{display:flex;flex-wrap:wrap;gap:22px;padding:0 26px;align-items:flex-start}
  /* A chat card is a fixed 300px in Foundry and does not scale. */
  .stage .dh{width:300px}
  .lbl{font:700 8px/1 "Google Sans Code",monospace;letter-spacing:.16em;color:#7d8794;
       margin-bottom:8px}
  #ok{margin:34px 26px 0;font:500 12px/1.7 "Google Sans Code",monospace;color:#9aa3ae;white-space:pre}
  #ok b{color:#7ddc8f;font-weight:700}
  #ok em{color:#ff7a5c;font-style:normal;font-weight:700}

  /* ── Foundry's button, stood in for ───────────────────────────────
     The `elements` layer sizes every <button> to one centred line 28px tall,
     and the creation window is made almost entirely of buttons that are not
     buttons in that sense — a class row, a step, a trait slot, a card. Left
     unreset it sheared the contents off every control in the window, and
     nothing in this repo could see it: the study pages have no Foundry, and
     `tsc`, `svelte-check` and the build do not look at CSS.

     So the page carries the rule. Layered, because `styles/*.css` arrive
     unlayered through their <link>s and unlayered always wins — which is the
     same relationship the `system` layer has to `elements` in the real
     application. Delete the reset at the top of make.css and the two checks
     at the foot of this page go red. */
  @layer elements {
    button{height:28px;min-height:28px;display:flex;align-items:center;
      justify-content:center;text-align:center;font-family:inherit}
  }
</style>
</head>
<body>

<div class="hd">
  <b>ported stylesheet check</b>
  <label><input type="checkbox" id="lt"> light substrate</label>
</div>

<h2><span>// THE PLATE</span>Chat cards, from the ported sheets</h2>
<div class="stage" id="plates"></div>

<h2><span>// THE DECK</span>Compendium entries, drawn by the vendored builder</h2>
<div class="stage" id="deck"></div>

<h2><span>// THE RAIL</span>Marks and gems, from the vendored components</h2>
<div class="stage" id="rail"></div>

<h2><span>// THE PANE</span>Where the traits strip belongs</h2>
<div class="stage" id="traits"></div>

<h2><span>// THE FORGE</span>The creation window, from the ported stylesheet</h2>
<div class="stage" id="forge"></div>

<pre id="ok"></pre>

<script type="module">
/* The plate markup comes from design/plate.js — the accepted source — so what
   is under test here is the *stylesheet* port and nothing else. */
import { A, DMG, FOE, play } from '/design/plate.js';
/* These come from the vendored copies the system actually ships. */
import { MARKS, DAMAGE } from '/src/module/ui/mark.js';
import { GEMS } from '/src/module/ui/gem.js';
import { CARD, fit } from '/src/module/ui/card.js';
import { OPT, PLATE, TRAY, VALS, levelPlates } from '/src/module/ui/make.js';
/* `CLASSES` is taken further down by the compendium's own class list, and the
   two are genuinely different things — nine slugs against nine documents. */
import { CLASSES as CLASS_SLUGS, KINDS, byslug, icon, glyph, clazz } from '/src/module/ui/domains.js';
/* And these are the shipping compendium, imported rather than transcribed —
   the point of the deck section is that the *data* is what gets drawn. */
import HERITAGE from '/src/packs-src/heritage.mjs';
import CLASSES from '/src/packs-src/classes.mjs';
import DOMAIN_CARDS from '/src/packs-src/domains.mjs';

const wrap = html => `<div class="dh dh-plate">${html}</div>`;

const duality = {
  who:'Tabby', label:'Agility', kind:'attack roll', img:'/design/assets/art-sample-01.png',
  h:9, f:4, out:'hope', total:15, dc:13, hit:true,
  mods:[{k:'agility', v:2}]
};
const crit = {...duality, h:7, f:7, out:'crit', total:16};
const fear = {...duality, h:3, f:10, out:'fear', total:14, hit:true};

const damage = {
  who:'Tabby', label:'Broadsword', img:'/design/assets/art-sample-01.png',
  n:2, die:'d8', rolls:[6,3], total:12, dtype:'physical', mods:[{k:'weapon', v:3}]
};

const foe = {
  who:'RIBBET BANDIT', label:'Hammer', d20:[15], total:17, target:'Tabby',
  dc:12, hit:true, mods:[{k:'attack modifier', v:2}]
};
const foeMiss = {...foe, d20:[7], total:9, hit:false};

document.getElementById('plates').innerHTML =
  [A(duality), A(crit), A(fear), DMG(damage), FOE(foe), FOE(foeMiss)].map(wrap).join('');

/* ── the deck ──────────────────────────────────────────────────────────
   One of each card subtype, straight out of `src/packs-src/`. This mirrors
   `sheets/cards.ts` rather than importing it — that file is TypeScript and
   knows what a Foundry Item is — so it deliberately maps only the four fields
   the compendium has to get right for a card to be drawable: the art, the
   printed number, the flavour line and the feature runs. If one of those is
   missing from the data it is missing from the picture below, and the checks
   at the foot of the page say which. */
const DECK = (() => {
  const one = (arr, type) => arr.find(d => d.type === type);
  return [
    one(DOMAIN_CARDS, 'domainCard'),
    one(HERITAGE, 'ancestry'),
    one(HERITAGE, 'community'),
    one(CLASSES, 'class'),
    one(CLASSES, 'subclass'),
  ];
})();

const STOCK = /\/assets\/(domains|types|classes)\//;
const plainText = html => (html || '')
  .replace(/<\/(p|ul|li)>/g, '\n').replace(/<li>/g, '\n• ')
  .replace(/<b>|<\/b>/g, '**').replace(/<i>|<\/i>/g, '*')
  .replace(/<[^>]*>/g, '').replace(/\s*\n\s*/g, '\n').trim();
const feats = list => list.filter(f => f?.name)
  .map(f => ({ n: f.name, t: plainText(f.description) }));

async function deck() {
  const sig = {};
  for (const d of Object.keys(byslug)) sig[d] = await icon(d);
  for (const g of ['ancestry', 'community']) sig['@' + g] = await glyph(g);
  for (const c of CLASS_SLUGS) sig['#' + c] = await clazz(c);

  const opts = (it) => {
    const s = it.system;
    const base = {
      name: it.name,
      code: s.printing?.code || '',
      // Single quotes: this lands in a double-quoted HTML style attribute.
      art: `--art:url('${it.img}')`,
      noart: STOCK.test(it.img),
    };
    switch (it.type) {
      case 'domainCard': return { ...base, d: byslug[s.domain], sig: sig[s.domain],
        lvl: s.level, rc: s.recallCost, type: s.cardType.toUpperCase(),
        foot: byslug[s.domain].name, text: plainText(s.description) };
      case 'ancestry': return { ...base, d: KINDS.ancestry, sig: sig['@ancestry'],
        type: 'ANCESTRY', foot: 'Heritage', flavour: plainText(s.description),
        feats: feats([s.topFeature, s.bottomFeature]) };
      case 'community': return { ...base, d: KINDS.community, sig: sig['@community'],
        type: 'COMMUNITY', foot: 'Heritage', flavour: plainText(s.description),
        feats: feats([s.feature]) };
      // fbsig: a class card has no artwork, so the fallback plate is the only
      // picture it ever shows — and its two domains are already in the corners.
      case 'class': return { ...base, d: byslug[s.domains.primary], d2: byslug[s.domains.secondary],
        sig: sig[s.domains.primary], sig2: sig[s.domains.secondary], type: 'CLASS',
        fbsig: sig['#' + it.name.toLowerCase()], fbname: it.name,
        foot: `${byslug[s.domains.primary].name} · ${byslug[s.domains.secondary].name}`,
        stats: [{ k: 'Evasion', v: s.startingEvasion }, { k: 'Hit Points', v: s.startingHitPoints }],
        flavour: plainText(s.description), feats: feats([s.classFeature, s.hopeFeature]) };
      case 'subclass': {
        const cls = CLASSES.find(c => c.type === 'class' && c.name === s.className).system.domains;
        return { ...base, d: byslug[cls.primary], d2: byslug[cls.secondary],
          sig: sig[cls.primary], sig2: sig[cls.secondary], type: 'SUBCLASS',
          fbsig: sig['#' + s.className.toLowerCase()], fbname: s.className,
          name: s.subclassName, foot: s.rank[0].toUpperCase() + s.rank.slice(1),
          stats: s.spellcastTrait
            ? [{ k: 'Spellcast', v: s.spellcastTrait[0].toUpperCase() + s.spellcastTrait.slice(1) }]
            : undefined,
          flavour: plainText(s.description), feats: feats(s.features) };
      }
    }
  };

  /* `noart` goes on the *wrapper*, not on `.card`. The rules are
     `.dh.noart .card .fb` and `.dh .noart .card .fb` — both want an ancestor,
     so `class="card noart"` matches neither and the fallback plate stays
     hidden behind an empty `.img`. Which is exactly how it read here for as
     long as the section existed: the class card looked like it had artwork
     that had failed to load, and the plate it was actually meant to be
     showing was never on screen to be wrong. `sheets/cards.ts` puts it on the
     wrapper, so this now matches what the sheet does. */
  document.getElementById('deck').innerHTML = DECK.map(it => {
    const o = opts(it);
    return `<div><div class="lbl">${it.type}</div>
      <div class="dh${o.noart ? ' noart' : ''}" style="${o.art}">${CARD(o)}</div></div>`;
  }).join('');
  fit(document.getElementById('deck'));
}
const deckReady = deck();

document.getElementById('rail').innerHTML = `
<div class="dh" style="width:288px;background:var(--paper);padding:16px">
  ${DAMAGE({major:8, severe:15, hp:7, marked:2, span:7})}
  ${MARKS({label:'Stress', total:6, marked:6, kind:'stress', vuln:true, span:7})}
  ${MARKS({label:'Slots', total:4, marked:1, kind:'armor'})}
  <div class="pool" style="margin-top:14px">
    <div class="hd"><span class="k">Hope</span><span class="n">4<s> / 6</s></span></div>
    ${GEMS({cur:4, max:6, scars:0, sz:32, gap:10, ground:'paper'})}
  </div>
</div>`;

/* The pane, twice.
   Left: the traits strip inside .scr, where the first version put it — it is
   tab content, so it scrolls away and it only exists on one tab out of five.
   Right: a direct child of .pane above the tab bar, which is where the design
   puts it and what `flex:none` on .trs is for.
   Both carry the Svelte scope class, so the component stylesheet applies. */
const SV = 'svelte-1fgn1r';
const TR = [['Agility','+2',true],['Strength','+1',false],['Finesse','+1',false],
            ['Instinct','+0',false],['Presence','+0',false],['Knowledge','−1',false]];

const trs = `<div class="trs ${SV}">${TR.map(([k,v,on]) =>
  `<button type="button" class="tr ${on ? 'on' : ''} ${SV}"><span class="k">${k}</span><span
     class="v">${v}</span><i class="mk"></i></button>`).join('')}</div>`;

const tabs = `<div class="tabs"><button class="on">loadout</button><button>vault</button
  ><button>gear</button><span class="ct">prof 1</span></div>`;

const filler = `<div class="pnl"><div class="k">Active weapons</div></div>`.repeat(6);

const pane = (inside) => `
  <div class="dh" style="width:420px">
    <div class="win" style="--w:100%">
      <div class="bd" style="--h:340px">
        <div class="pane">
          ${inside ? tabs + `<div class="scr">${trs}${filler}</div>`
                   : trs + tabs + `<div class="scr">${filler}</div>`}
        </div>
      </div>
    </div>
  </div>`;

document.getElementById('traits').innerHTML = `
  <div>
    <div class="lbl">BEFORE · inside .scr</div>${pane(true)}
  </div>
  <div>
    <div class="lbl">AFTER · child of .pane</div>${pane(false)}
  </div>`;

/* ── THE FORGE ──────────────────────────────────────────────────────
   The creation window, built with the *vendored* make.js against the
   *ported* make.css — so what is under test is the round trip, not the
   study page.

   The one thing this catches that `design/make.html` structurally cannot:
   `make.css` is loaded here beside `sheet.css`, `card.css`, `tile.css` and
   `dlg.css`, all inside one `.dh` root, which is the stack a real Foundry
   window has and the stack a study page never does. Two of our own
   stylesheets colliding is invisible on a page that loads one of them —
   that is exactly how `.die.win` and `.dfn .pl` got shipped. */
document.getElementById('forge').innerHTML = `
  <div>
    <div class="lbl">RAIL · steps and the character so far</div>
    <div class="dh" style="width:288px;background:var(--paper);
         box-shadow:inset 0 0 0 1px var(--frame-line)">
      <div class="forge" style="display:block">
        <div class="fside" style="width:288px;border-right:0">
          <div class="fsteps">
            <button type="button" class="fstep done"><i>1</i><span>Class</span></button>
            <button type="button" class="fstep on"><i>3</i><span>Traits</span></button>
            <button type="button" class="fstep" disabled><i>8</i><span>Domain Cards</span><em>needs a class</em></button>
          </div>
          <div class="fvals" id="fv">${VALS([
            { head: 'the character' },
            { k: 'Evasion', v: null },
            { k: 'Hit Points', v: 7 },
            { k: 'Hope', v: 2, sub: '/ 6' },
          ])}</div>
        </div>
      </div>
    </div>
  </div>
  <div>
    <div class="lbl">OPTIONS · chosen, and refused</div>
    <div class="dh" style="width:300px;background:var(--paper);padding:14px;
         box-shadow:inset 0 0 0 1px var(--frame-line)">
      <div class="forge" style="display:block">
        <div class="fgrid" style="grid-template-columns:1fr">
          ${OPT({ name: 'Guardian', meta: 'Valor · Bone', on: true,
                  nums: [{ k: 'Evasion', v: 9 }, { k: 'HP', v: 7 }] })}
          ${OPT({ name: 'Whirlwind', meta: 'Blade · Level 1',
                  why: 'Blade · not one of your domains' })}
        </div>
        <div style="margin-top:12px">${TRAY([
          { v: 2, spent: true }, { v: 1 }, { v: 1, armed: true },
          { v: 0 }, { v: 0 }, { v: -1 },
        ])}</div>
      </div>
    </div>
  </div>
  <div>
    <div class="lbl">PLATE · on the sheet's rail, before and after</div>
    <div class="dh" style="width:288px;background:var(--paper);
         box-shadow:inset 0 0 0 1px var(--frame-line)">
      ${PLATE({ done: false, at: 3, of: 6, label: 'Make this character',
                hint: '3 of 6 · traits, equipment outstanding' })}
      ${PLATE({ done: true, at: 6, of: 6, label: 'Character creation',
                hint: 'Finished — open it to change anything' })}
    </div>
  </div>
  <div>
    <div class="lbl">CLASS ROW &amp; CARD GRID · the two shapes a step can offer</div>
    <div class="dh" id="forge2" style="width:470px;background:var(--paper);padding:14px;
         box-shadow:inset 0 0 0 1px var(--frame-line)"></div>
  </div>`;

/* The class row and the card grid, both of which need a sigil off disk, so
   both are built asynchronously and the checks wait on this. The class row is
   the one control on the page that is *taller than a paragraph*, which makes
   it the honest subject for the button-height check below; the card grid is
   the only place `levelPlates` can be observed doing anything. */
const forgeReady = (async () => {
  const box = document.getElementById('forge2');
  const mark = await clazz('guardian');
  const valor = byslug.valor;
  const sigs = { grace: await icon('grace'), codex: await icon('codex') };

  const GRID = [
    { d: 'grace', name: 'Inspirational Words', lvl: 1, rc: 1, type: 'ABILITY',
      text: 'Your speech is imbued with power. After a long rest, place a number of tokens on this card equal to your Presence.' },
    { d: 'codex', name: 'Book of Ava', lvl: 1, rc: 0, type: 'GRIMOIRE',
      text: '**Power Push:** Make a *Spellcast Roll* against a target within Melee range. On a success, they are knocked back to Far range and take d10+2 magic damage.' },
  ];

  box.innerHTML = `
    <div class="forge" style="display:block">
      <div class="fclass">
        <button type="button" class="fcls on">
          <span class="fsig" style="--c:${valor.light}">${mark}</span>
          <span class="fmain">
            <s>Valor · Bone</s>
            <b>Guardian</b>
            <span class="fnum"><i>Evasion <b>9</b></i> <i>Hit Points <b>7</b></i></span>
            <p>The title of guardian represents an array of martial professions, speaking more to
            their moral compass and unshakeable fortitude than the means by which they fight.
            Guardians are known for fighting with remarkable ferocity even against overwhelming
            odds, defending their cohort above all else.</p>
          </span>
        </button>
      </div>
      <div class="fcards" style="margin-top:14px">
        ${GRID.map((c, i) => `<button type="button" class="fcrd${i === 0 ? ' on' : ''}">
          ${CARD({ ...c, d: byslug[c.d], sig: sigs[c.d], foot: byslug[c.d].name })}
        </button>`).join('')}
      </div>
    </div>`;

  fit(box);
  levelPlates(box);
})();

document.getElementById('lt').addEventListener('change', e =>
  document.documentElement.classList.toggle('dh-light', e.target.checked));

for(const el of document.querySelectorAll('.pl')) play(el);

/* Two things the port could have silently broken, checked rather than
   eyeballed: that the palette actually resolves inside .dh, and that it does
   *not* resolve outside it. A token that still lands on :root would look
   perfect here and leak into every other package in Foundry. */
/* setTimeout rather than requestAnimationFrame: rAF does not fire in a window
   that is not painting, and a verification page is very often screenshotted
   from a background tab. Same reason the plate's own tumble is on a timer. */
setTimeout(async () => { try {
  // The deck fetches its sigils, so it may still be building.
  await deckReady;
  const inside = getComputedStyle(document.querySelector('.dh'));
  const outside = getComputedStyle(document.body);
  const lines = [];
  const check = (label, pass, detail) =>
    lines.push(`${pass ? '<b>PASS</b>' : '<em>FAIL</em>'}  ${label}${detail ? '  — ' + detail : ''}`);

  const paper = inside.getPropertyValue('--paper').trim();
  const leak = outside.getPropertyValue('--paper').trim();
  check('palette resolves inside .dh', !!paper, `--paper: ${paper || 'unset'}`);
  check('palette does NOT leak to :root', !leak, leak ? `--paper leaked as ${leak}` : 'clean');

  const dice = document.querySelectorAll('.pl .die').length;
  const cores = document.querySelectorAll('.pl .die .core').length;
  check('dice built with all three layers', dice > 0 && dice === cores, `${dice} dice / ${cores} cores`);

  const cards = [...document.querySelectorAll('#plates > .dh')];
  const widths = new Set(cards.map(c => Math.round(c.getBoundingClientRect().width)));
  check('every plate is 300px', widths.size === 1 && widths.has(300), [...widths].join(', ') + 'px');

  // 7 Hit Points + 6 Stress + 4 Armor Slots; 2 + 6 + 1 of them marked.
  const boxes = document.querySelectorAll('#rail .mk .row > i').length;
  const marked = document.querySelectorAll('#rail .mk .row > i.on').length;
  check('mark rows built', boxes === 17 && marked === 9, `${boxes} boxes, ${marked} marked`);

  const gems = document.querySelectorAll('#rail .gem').length;
  check('gem row built', gems === 6, `${gems} gems`);

  /* The deck. Five cards, one per subtype, drawn from the shipping packs.
     What can silently break here is not the CSS but the *data*: art that
     404s leaves a card looking merely dark, and a footer with no card
     number looks like a design choice. Neither is visible by eyeballing. */
  const deckCards = [...document.querySelectorAll('#deck .card')];
  check('one card of each subtype drawn', deckCards.length === 5, `${deckCards.length} cards`);

  const arts = [...document.querySelectorAll('#deck > div > .dh')]
    .map(el => (getComputedStyle(el).getPropertyValue('--art').match(/url\(\s*['"]?(.+?)['"]?\s*\)/) || [])[1])
    .filter(Boolean);
  const loaded = await Promise.all(arts.map(src => new Promise(done => {
    const i = new Image();
    i.onload = () => done(true);
    i.onerror = () => done(false);
    i.src = src;
  })));
  const missing = arts.filter((_, i) => !loaded[i]);
  check('every card\'s img resolves', arts.length === 5 && !missing.length,
        missing.length ? missing.join(', ') : `${arts.length} images`);

  /* The class card is the one with no artwork — there is no printed class
     card to take any from — so the fallback plate is the only picture it ever
     shows, and it has to be showing something the card has not already said.
     The corners carry Grace and Codex; a fallback plate drawing Grace again,
     at plate size, under the word "Grace", is a third copy of a fact stated
     twice. So: the plate is visible, and its mark is not the corner sigil. */
  const cls = document.querySelector('#deck > div:nth-child(4)');
  const fb = cls?.querySelector('.card .fb');
  const shown = fb && getComputedStyle(fb).display !== 'none';
  const plate = fb?.querySelector('.mark > svg')?.outerHTML;
  const corner = cls?.querySelector('.lvl .sg > svg')?.outerHTML;
  const word = fb?.querySelector('.wordmark')?.textContent.trim();
  check('the class card falls back to its class mark, not a domain sigil',
        !!shown && !!plate && plate !== corner && word === 'Bard',
        shown ? `wordmark "${word}", ${plate === corner ? 'SAME as corner sigil' : 'own mark'}`
              : 'fallback plate is not visible');

  /* The class card has no printed number and keeps the placeholder; the
     other four carry their own. */
  const codes = [...document.querySelectorAll('#deck .ft .mi:last-child')].map(e => e.textContent.trim());
  const real = codes.filter(c => !/·004$/.test(c));
  check('printed card numbers reach the footer', real.length === 4, codes.join('  '));

  /* Flavour belongs in .fl. A class or subclass description landing in .tx
     is the bug this section was added for: it renders as rules text, and
     rules text is what invites a paragraph of lore. */
  const flavoured = ['#deck > div:nth-child(2)', '#deck > div:nth-child(3)',
                     '#deck > div:nth-child(4)', '#deck > div:nth-child(5)'];
  const inFl = flavoured.filter(s => document.querySelector(`${s} .cnt .fl`)).length;
  const inTx = flavoured.filter(s => document.querySelector(`${s} .cnt .tx`)).length;
  check('flavour sits in .fl, not .tx', inFl === 4 && inTx === 0, `${inFl} in .fl, ${inTx} in .tx`);

  /* ── the forge ────────────────────────────────────────────────────
     The rail is the sheet's own 288px measure, and the two windows sitting
     side by side is the whole reason the live numbers are worth watching.
     A ported rule that lost its width would be invisible on the study page,
     which sets the width on its own wrapper. */
  const side = document.querySelector('#forge .fside');
  check('creation rail matches the sheet at 288px',
        Math.round(side?.getBoundingClientRect().width) === 288,
        `${Math.round(side?.getBoundingClientRect().width ?? 0)}px`);

  /* An unset value is an em dash and not a zero. Zero is a number a rule
     produced; the dash is the absence of the rule, and a rail claiming
     "Evasion 0" before a class exists is stating something false. */
  const unset = document.querySelector('#forge .fval[data-k="Evasion"]');
  check('an unset rail value is a dash, not a zero',
        unset?.classList.contains('none') && unset.querySelector('b')?.textContent === '—',
        unset?.querySelector('b')?.textContent ?? 'missing');

  /* Four bracket gradients on a chosen option — the vault's own recipe. If
     the port ever mangles the multi-value background shorthand, the tile
     goes from "chosen" to "slightly different background" in silence. */
  const chosen = document.querySelector('#forge .fopt.on');
  const brackets = chosen
    ? (getComputedStyle(chosen, '::after').backgroundImage.match(/linear-gradient/g) || []).length
    : 0;
  check('a chosen option wears the vault brackets', brackets === 4, `${brackets} of 4 corners`);

  /* Dead, not hidden: a refused option is still on screen, still says why. */
  const refused = document.querySelector('#forge .fopt[disabled]');
  const why = refused?.querySelector('.fwhy')?.textContent?.trim();
  check('a refused option stays visible and says why',
        !!refused && getComputedStyle(refused).display !== 'none' && !!why, why || 'no reason given');

  /* The spent chip keeps its slot as a hole rather than closing the row up —
     the budget's *shape* is what tells you what is left. Equal widths is the
     test: a chip that collapsed would measure zero. */
  const chipW = new Set([...document.querySelectorAll('#forge .fchip')]
    .map(c => Math.round(c.getBoundingClientRect().width)));
  check('a spent chip keeps its slot', chipW.size === 1, [...chipW].join(', ') + 'px');

  /* The one collision this page exists to catch. `make.css` and `dlg.css` are
     both loaded, both inside `.dh`, and `.pick`/`.picks` belong to dlg. If a
     future rename in make.css ever reached for one of those, the damage would
     show up here as a dialog row that stopped looking like a dialog row. */
  await forgeReady;

  /* Every control in this window is a <button>, and Foundry sizes those to
     one centred line 28px tall. The class row is four lines of paragraph and
     a 118px mark plate; if it measures 28 the reset at the top of make.css
     has gone, and with it the contents of every option in the window. This is
     the check that would have caught the whole thing. */
  const row = document.querySelector('#forge2 .fcls');
  const rowH = Math.round(row?.getBoundingClientRect().height ?? 0);
  check('a control is as tall as what is printed on it, not 28px',
        rowH > 60, `class row is ${rowH}px`);

  /* The other half of the same element rule: a centred flex box. A class row
     whose columns centre themselves reads as a caption rather than a panel,
     and the review page's cells centred their headings for exactly this. */
  check('a control is not centred by Foundry\'s button rule',
        getComputedStyle(row).alignItems === 'stretch' &&
        getComputedStyle(document.querySelector('#forge .fopt')).alignItems === 'flex-start',
        `${getComputedStyle(row).alignItems} / ${getComputedStyle(document.querySelector('#forge .fopt')).alignItems}`);

  /* The class mark is the only picture a class has, and it takes its primary
     domain's hue. An empty plate looks like a design choice. */
  const sig = document.querySelector('#forge2 .fcls .fsig > svg');
  check('the class row draws its class mark', !!sig,
        sig ? 'mark present' : 'the plate is empty');

  /* `fit()` sizes each card alone, which is right for one card and ragged for
     a grid; `levelPlates` takes the smallest. Equal plates is the whole
     observable effect, so it is the test. */
  const plates = new Set([...document.querySelectorAll('#forge2 .fcards .card')]
    .map(c => c.style.getPropertyValue('--plate')));
  check('a card grid shares one art-plate height', plates.size === 1,
        [...plates].join(' / ') || 'no cards');

  /* A chosen card wears the brackets *outside* itself — six gradients, not
     four, because a card has no chamfered corner to skip. */
  const pickedCard = document.querySelector('#forge2 .fcrd.on');
  const cardBrackets = pickedCard
    ? (getComputedStyle(pickedCard, '::after').backgroundImage.match(/linear-gradient/g) || []).length
    : 0;
  check('a chosen card wears brackets outside the artwork', cardBrackets === 6,
        `${cardBrackets} of 6 corners`);

  const forgeNames = ['fopt', 'fchip', 'fstep', 'fval', 'ftrt', 'ftray', 'fside', 'fgrid',
                      'fcls', 'fcrd', 'fcards', 'fclass'];
  const clash = forgeNames.filter(n => document.querySelector(`.dlg .${n}`));
  check('creation class names do not reach into the dialog', clash.length === 0,
        clash.length ? clash.join(', ') : 'no overlap');

  document.getElementById('ok').innerHTML = lines.join('\n');
} catch (err) {
  document.getElementById('ok').innerHTML = `<em>THREW</em>  ${err.message}`;
} }, 700);
</script>
</body>
</html>

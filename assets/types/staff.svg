<!-- Staff: a knotted shaft the full height under a forked head, the bowl between
     the tines carrying the read. Drawn, not traced. See art-src/marks/BRIEF.md.

     The head is one outline rather than two tines welded to the shaft. Drawn
     as two limbs they met the shaft at a point and the gap between them closed
     into a V, which is a wishbone and not a crown. As one outline the inner
     edge can bulge wider than the gap between the tips, so the tips overhang
     and the void is a bowl the eye still finds at 14px. -->

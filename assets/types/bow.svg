  <path d="M 132 18 L 222 128 L 132 232 L 132 210 L 202 128 L 132 40 Z"/>
  <path d="M 214 114 L 66 114 L 66 88 C 48 99 32 112 18 125 C 32 138 48 151 66 162 L 66 136 L 214 136 Z"/>
  <path d="M 96 114 C 118 110 142 104 158 96 C 148 108 140 112 132 114 Z"/>
  <path d="M 96 136 C 118 140 142 146 158 154 C 148 142 140 138 132 136 Z"/>

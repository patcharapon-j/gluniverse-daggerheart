<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 250 250" fill="currentColor">
  <!-- Longbow at full draw, arrow pointing left. The one mark in the set that is handed
       rather than mirrored about x=125, because a bow with no string side stops being a
       bow. The string is pulled into a V rather than left straight: straight, it reads
       as a bracket standing next to an arrow, and the V is what says drawn. The limb
       sits well right of the frame edge so the head clears it and still has room to
       taper. See art-src/marks/BRIEF.md. -->

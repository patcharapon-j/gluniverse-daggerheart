<!-- Longbow at full draw, arrow pointing left. The one mark in the set that is handed
     rather than mirrored about x=125, because a bow with no string side stops being a
     bow. The string is pulled into a V, since a straight string reads as a bracket
     standing next to an arrow. The limb is built as a deep round crescent and runs far
     heavier than the string: drawn at similar widths and close to their chords, limb
     and string closed into a plain diamond at 24px and the bow vanished. The head is
     drawn wide enough to clear the limb it crosses, because the point is otherwise
     lost inside it, and the tips are left blunt where the string meets them rather
     than recurved, which left a hairline that broke at the nock.
     See art-src/marks/BRIEF.md. -->

<!-- Wand: a faceted gem carved hollow, two collar barbs, a tapering handle.
     Drawn, not traced. See art-src/marks/BRIEF.md.

     Laid on the diagonal. Stood upright it could only fill the live area by
     growing as long as the staff, and length is the one cue the staff owns.
     On the diagonal it reaches both corners while staying a short wand, and
     the gem lands in the top corner with nothing beside it to share the read.
     The hollow is the gem's own outline at forty per cent, so the carved edge
     repeats the facets instead of rounding them off. -->

<!-- Domain card: a tablet with four corner mounts and an empty faceted socket.
     Drawn rather than traced, on the construction in art-src/marks/BRIEF.md.

     The third fallback and the rarest. A domain card names a domain by
     definition, so this is only for one that is not among the thirteen on disk.

     The corner ornaments are separate shapes with a carved gap, not filled
     spurs. An ornament sweeping inward over a solid field is invisible, so the
     field is cut back and the gap does the drawing. At 14px the gaps close up
     and the silhouette is a plain chamfered tablet, which is the order the two
     reads are wanted in.

     The socket is the one angular shape in the mark. That is what makes an
     empty setting read as cut rather than as another hole in the field, and it
     is empty for the same reason the lozenge on class.svg is. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 250 250" fill="currentColor">

<!-- Feature: a rising spark, a swept chevron with a mote above the apex.
     Drawn rather than traced, see art-src/marks/BRIEF.md.

     Nothing sits under the apex. That absence is the whole separation from
     primary.svg, which is also a pointed upward thing but carries a tang, and
     at 14px the tang and the empty space are the only difference the eye
     gets. The mote above the apex is the second half of that cue, so it is
     kept wide and short rather than fine, or it disappears at chip size.

     The limbs are two paths meeting along x=125 so each carries its own
     carved sliver. One evenodd path over the whole chevron would join the two
     slivers into a single wedge and the mark would go hollow at the centre.

     The outer edge bows well above the straight line from apex to tip. Drawn
     straight the limbs read as an arrowhead, and the sweep is what puts this
     on the same row as the domain marks.

     Tips land on 18 and 232 so the mark holds the full live area. A chevron
     pulled in from the edges reads as a smaller mark, not a lighter one. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 250 250" fill="currentColor">
  <path fill-rule="evenodd" d="M125 64 C84 86 48 138 18 214 C56 184 94 156 125 138 Z M125 86 C108 100 94 130 78 156 C90 146 104 128 125 108 Z"/>
  <path fill-rule="evenodd" d="M125 64 C166 86 202 138 232 214 C194 184 156 156 125 138 Z M125 86 C142 100 156 130 172 156 C160 146 146 128 125 108 Z"/>
  <path d="M125 18 C132 29 141 36 141 42 C141 49 134 54 125 54 C116 54 109 49 109 42 C109 36 118 29 125 18 Z"/>
</svg>

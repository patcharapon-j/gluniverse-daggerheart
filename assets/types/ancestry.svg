<!-- Ancestry: two links of a chain, interlocked.
     Drawn to art-src/marks/BRIEF.md.

     Two lineages joined, and joined is the word the mark has to carry, so
     it is two links rather than two of anything side by side. Side by side
     was the problem: every version built as a symmetric pair read as a moth
     or as a set of ears, because two upward limbs flanking a centred void
     is a face before it is anything else. Set on a diagonal and threaded
     through each other there is no axis to mirror about.

     Each ring is open, and the break is where the other ring passes in
     front of it. That is the only way a flat fill can say over and under,
     since both links are the same colour and z order buys nothing. The ends
     of each break taper to points so it reads as a ring continuing behind
     rather than a ring with its ends cut off. -->

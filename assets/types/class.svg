<!-- Class: a standard, for a class whose domain this system has no art for.
     Drawn to art-src/marks/BRIEF.md.

     Two failures are designed out of this one. Centred versions read as a
     crown: a symmetric field with two points at the foot and a spike on top
     is a coronet before it is a banner. Hanging the cloth off one edge of
     an off-centre staff fixes that. Then bowing the fly edge outward to get
     some life into it turned the whole mark into an axe, because a straight
     shaft with a convex blade beside it is an axe and `axe.svg` is two tiles
     away. So the fly is held straight and the movement is in the tail and
     the drop of the head instead.

     The device in the field is a void and stays blank on purpose. That is
     the part a real domain would have filled. -->

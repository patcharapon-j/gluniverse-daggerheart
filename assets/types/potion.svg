<!-- Potion: a round-bellied bottle, cork over a tapering neck, with a splash
     curl thrown off the rim.

     The curl leaves the rim on one side only. A symmetric pair of curls reads
     as a bomb fuse at 14px and bomb.svg sits on the same row. The glint on the
     shoulder is carved, not drawn as a highlight shape, so it survives being
     recoloured by the card it lands on. The belly flattens where it stands so
     the bottle sits rather than floats.
     Construction rules: art-src/marks/BRIEF.md -->

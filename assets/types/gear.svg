<!-- Equipment: a plate with a core.
     Drawn on the set's shared grid — see art-src/types/GRID.md.

     The generic mark, so it is the generic shape: the card's own chamfered
     plate with something set in the middle of it, saying "a thing you carry"
     without saying which thing. Square, which separates it from the two other
     plate marks — domain-card.svg is the card's own 0.71 aspect and loot.svg
     is wider than tall.

     Three subpaths, evenodd: plate, inner edge, core. The 34-unit ring and
     the 33-unit gap either side of the core are what stop the three
     collapsing into one filled square at 14px. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 250 250" fill="currentColor">
  <path fill-rule="evenodd" d="M46 24H204L226 46V204L204 226H46L24 204V46Z
                               M80 58H170L192 80V170L170 192H80L58 170V80Z
                               M125 91 159 125 125 159 91 125Z"/>
</svg>

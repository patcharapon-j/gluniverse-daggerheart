<!-- Ring: a worn band at three quarters, raised setting, faceted stone, two
     shoulders flaring from the band up into the setting.
     Drawn rather than traced, see art-src/marks/BRIEF.md.

     The band is an ellipse. A circle with a stone on it is a lollipop, and
     the foreshortening is the only thing saying this is worn on a hand.

     The gap between the two shoulders, the band and the bezel is left open
     on purpose. Filled in, the whole top became one solid dome and the mark
     read as a chess piece rather than as jewellery.

     The stone is a lozenge with a point at the top, where the gem mark is a
     brilliant with a flat table. Pointed against flat is what tells the two
     apart at 14px, since neither one keeps its facets at that size. -->

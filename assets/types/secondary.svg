                               M125 132C134 139 140 146 145 152C140 158 134 165 125 172C116 165 110 158 105 152C110 146 116 139 125 132Z"/>
  <path fill-rule="evenodd" d="M187 164L210 183L169 232L146 213Z
                               M190 176L198 183L166 221L158 214Z"/>

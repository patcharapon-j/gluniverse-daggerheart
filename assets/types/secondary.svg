<!-- Secondary weapon: two short blades crossed low, each widening from the point
     to a bound collar, with the crossing carved open. Drawn, not traced. See
     art-src/marks/BRIEF.md.

     The crossing is the decision and it was got wrong first. Letting the blades
     overlap inside one evenodd path unfills the overlap for free, which looks
     right on paper, but the hole it makes runs out to the background at both
     ends of its long diagonal. The X is then pinched to two single points and
     the mark falls into two loose blades. So the X is drawn as one outline
     around the union of both, with a lozenge carved inside the hub, which
     leaves 14 units of metal welding the four limbs together.

     Limbs are 48 wide, not the 60 the first solid version used. At 60 the four
     of them met in a mass with a hole in it rather than reading as two blades
     laid across each other, because the hub grows as fast as the limbs do.

     The collars are bands across the two lower limbs with a binding groove cut
     through each, and both sit well below the hub. That is what keeps this off
     the bone sigil, which crosses at the middle and is knobbed at all four
     ends. This is two points up, two collars down, nothing on the ends. -->

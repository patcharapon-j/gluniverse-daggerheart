<!-- Vial: a tall narrow tube on a flared foot, a tapering collar and a stopper
     above, with a carved fill line near the top.

     The fill line stops short of both walls, because a full-width cut would
     sever the tube into two floating pieces. The tube is waisted rather than
     parallel-sided: a straight tube beside potion.svg is a constant-width band
     and reads as a diagram. The collar carries the carved ring, not the tube,
     because the tube is too narrow to lose any more width to a cut.
     Construction rules: art-src/marks/BRIEF.md -->

<!-- Crossbow: seen from above, a bolt on the stock.
     Drawn to art-src/marks/BRIEF.md.

     The cross is the whole mark. Seen from above a crossbow is a heavy
     stock crossed by a bow, and that T is what tells it apart from `bow` at
     14px, where a longbow's recurve is gone. Drawn as a dome over the stock
     it reads as a mushroom, so the prod is held shallow and its limbs taper
     well past the stock's width on both sides.

     The string is a straight bar behind the prod, and it is the only
     straight line here. It is what stops the prod reading as a canopy.
     The prod sits low rather than at the head, so the bolt has room to
     break past it; with the cross up at the top the mark reads as a
     crucifix instead. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 250 250" fill="currentColor">
  <path d="M16 162 C 70 114 180 114 234 162 C 180 136 70 136 16 162 Z"/>
  <path d="M20 166 L230 166 L230 178 L20 178 Z"/>
  <path d="M108 124 L142 124 L142 232 L108 232 Z"/>
  <path d="M142 194 L170 206 L142 216 Z"/>
  <path d="M125 16 L139 56 L139 142 L111 142 L111 56 Z"/>
</svg>

<!-- Heater shield. The valor domain sigil is also a shield cut by chevrons, so this
     one turns its chevron apex up and spends the freed lower half on a ringed boss.
     The horns are cut into the outline rather than set on top of the shoulders, since
     horns added as separate spikes read as torn flags at 24px, and the sides start
     closing from the shoulder so the foot is a long point instead of a spike hung off
     two lobes. See art-src/marks/BRIEF.md. -->

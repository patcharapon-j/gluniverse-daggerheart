<!-- Primary weapon: one spearhead, apex up, with a tang.
     Drawn on the set's shared grid — see art-src/types/GRID.md.

     A point is the one weapon idea that is not also a genre: a sword, a rifle
     and a boarding pike all land on it, where a crossguard lands on fantasy.
     Bevelled shoulders and a 40-wide tang so it belongs to the plate family
     rather than reading as a UI arrow, and the tang is also what keeps it
     apart from feature.svg's chevron — that one has nothing underneath it.
     Symmetric about x=125: half-widths 62, 44, 20. -->

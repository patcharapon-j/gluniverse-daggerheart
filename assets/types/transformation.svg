<!-- Transformation: one lozenge caught turning through itself.
     Drawn on the set's shared grid — see art-src/types/GRID.md.

     Ancestry is two lozenges side by side because two lineages sit beside
     each other. This is the same charge rotated through itself, because a
     transformation is one thing that became a different one rather than two
     things held at once.

     Both lozenges are voided with a smaller copy of themselves. Filled, the
     pair covers most of the live area and lands as a solid star — the voids
     are what keep the ink inside the family's range and what keep the two
     orientations tellable from each other. Evenodd per path. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 250 250" fill="currentColor">
  <path fill-rule="evenodd" d="M125 24 195 125 125 226 55 125Z
                               M125 69 164 125 125 181 86 125Z"/>
  <path fill-rule="evenodd" d="M24 125 125 55 226 125 125 195Z
                               M69 125 125 86 181 125 125 164Z"/>
</svg>

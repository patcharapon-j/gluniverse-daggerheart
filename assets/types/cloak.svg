<!-- Cloak: hung by the shoulders, hood empty, hem torn to three points.
     Drawn rather than traced, see art-src/marks/BRIEF.md.

     This one only has to beat cloth-armor.svg at 14px, and both are a shoulder
     over a fall of cloth, so the difference is carried twice. The hood keeps a
     void wide enough to stay open at 14px, the one hole in the set, and the hem
     tears to three points where the robe's hem is a solid bar.

     The cloth is three overlapping panels rather than one notched outline. Cut
     as notches the tears were straight lines between two edges of the same
     shape; as panels each one ends in its own point and the tear between them
     opens on its own. The panels also start below the hood's opening, which is
     what keeps that void clear.

     The fall is almost straight from the shoulders. Flared, it swept out past
     the hood, the mark read as a moth, and it put the robe's outline on a cloak. -->

<!-- Tool: adventuring kit drawn as a lantern. Tapering ring handle, cage with
     its bars carved out, a flame inside the cage, flared base.
     Drawn rather than traced, see art-src/marks/BRIEF.md.

     One object, not a pile of implements. A hammer and tongs and rope
     crossed over each other is three silhouettes fighting for the same
     square, and at 14px it is a smudge with no name.

     Cage, window, two bars and the flame are five subpaths under one evenodd
     fill, so the flame is an island inside the window. Painted on top of the
     cage in the same fill it would not exist at all.

     The handle is open at the bottom with both ends tapering, so it reads as
     a bail hanging on a hook rather than as a solid ring. -->

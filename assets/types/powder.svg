<!-- Powder: a pouch tipped mouth-down with four tapering grains falling in a
     widening cone.

     The pouch narrows to a waist and flares again at the mouth, because a sack
     that only tapers reads as a tail rather than an opening, and the carved
     cinch at the waist is what says pouch rather than horn. The fall carries
     the mark, so the cone is given the whole lower frame.
     Construction rules: art-src/marks/BRIEF.md -->

<!-- Bag: a drawstring pouch. Round bottomed sack, cinched neck, the
     drawstring and both cord ends carved as one void, body bulging unevenly
     so it reads as full.
     Drawn rather than traced, see art-src/marks/BRIEF.md.

     The drawstring and the two tails are a single Y shaped subpath. Drawn as
     three overlapping voids the overlaps crossed back to filled under
     evenodd, and two black wedges appeared inside the drawstring.

     The tails are carved into the body rather than hung outside it. A sack
     this wide leaves no clear air at its sides, and a cord drawn in the same
     fill as the sack it crosses does not exist.

     The small flick off the knot is the one asymmetry. A matched pair there
     read as horns and turned the neck into a head. -->

<!-- Bard: an eighth note. Grace and Codex — performance and language.
     A plectrum was drawn first and thrown away: reduced to a chamfered
     silhouette it is a shield with two slots in it, which is the one shape
     this whole set is trying not to be.
     A note is the only music mark that is a *shape* rather than an
     instrument, so it stays out of the genre argument the type glyphs also
     had to stay out of. Head chamfered rather than elliptical, flag a solid
     wedge rather than a curve, to hold the family's line. -->

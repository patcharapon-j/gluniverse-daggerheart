  <path d="M36 172 66 152 104 152 124 172 124 200 94 220 56 220 36 200Z"/>
  <path d="M124 40 148 40 148 200 124 200Z"/>
  <path d="M148 40 216 76 216 120 148 84Z"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
  <!-- An ice crystal: three spokes, six barbed tips. Not the eight-point burst
       Stunned draws — that one is a blow landing, all irregular, and this is
       the opposite claim. Frost is regular: it grows the same way in every
       direction, which is why the barbs repeat identically on all six arms and
       why the whole figure is one shape rotated twice rather than drawn once.

       Barbs rather than plain rays because a bare three-spoke star at 24px is
       an asterisk, and an asterisk is punctuation. -->
  <g>
    <path d="M32 5v54"/>
    <path d="m24 14 8-8 8 8M24 50l8 8 8-8"/>
  </g>
  <g transform="rotate(60 32 32)">
    <path d="M32 5v54"/>
    <path d="m24 14 8-8 8 8M24 50l8 8 8-8"/>
  </g>
  <g transform="rotate(120 32 32)">
    <path d="M32 5v54"/>
    <path d="m24 14 8-8 8 8M24 50l8 8 8-8"/>
  </g>
</svg>

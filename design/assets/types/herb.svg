<!-- Herb: one cut sprig, a single stem with a root hook at the foot splitting
     into three leaves with carved midribs. Each midrib stops well short of its
     tip, because a rib run the whole length turns the leaf into an outline at
     24px. Three leaves and nothing else is the point: the root domain sigil is
     a many-tendrilled plant and grace is a bladed butterfly, so this has to
     stay the sparse one. Construction rules: art-src/marks/BRIEF.md -->

<!-- Ancestry: two interlocking lozenges — two lineages joined. The lozenge is
     the heraldic charge for descent, which is both on-meaning and genre-neutral.
     Taller than wide so it reads as heraldry rather than as a UI diamond.
     One evenodd path, so the overlap knocks through: a stroked outline would
     fill in solid at the ~14px the corner plate renders at. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 250 250" fill="currentColor">
  <path fill-rule="evenodd" d="M88 20 146 125 88 230 30 125Z M162 20 220 125 162 230 104 125Z"/>
</svg>

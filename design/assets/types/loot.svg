<!-- Loot: a strongbox, domed lid over a strapped body, latch in the seam.
     Drawn rather than traced, see art-src/marks/BRIEF.md.

     The latch is inscribed entirely inside the seam band. A latch that hangs
     past the band gives an evenodd path two crossings above the band and two
     below, and it punches two holes in the lid instead of drawing one latch.
     That is what the previous version did. Rasterize before believing it.

     The rib carved into the lid stops short of the skirt at both ends. Run it
     the full width and the dome is cut into two thin arcs and the mark reads
     as a rainbow, which is what the first two drafts here did.

     The corner straps are carved out of the body as negative space rather
     than laid over it, because a strap painted in the same fill as the box is
     not there at all. The slots stop above the base so the straps taper into
     a solid foot. Taken to the bottom edge they read as four legs. -->

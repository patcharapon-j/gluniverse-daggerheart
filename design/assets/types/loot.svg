<!-- Loot: a chest, seam and latch.
     Drawn on the set's shared grid — see art-src/types/GRID.md.

     Loot used to borrow gear.svg's ring-and-core, which made every found item
     look like equipment somebody had chosen to carry — and the two sit side
     by side on the gear tab, so the borrowing was visible rather than
     theoretical.

     Wider than tall, which no other mark here is: the aspect alone separates
     it on a chip before any detail resolves. A chest is also the one
     container that reads the same in every genre the art has to cover, a
     strongbox and a cargo case included.

     The latch is inscribed exactly in the seam band rather than straddling
     it. A lozenge hanging past the seam would count two crossings above and
     below and punch two holes in the lid. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 250 250" fill="currentColor">
  <path fill-rule="evenodd" d="M46 62H204L226 84V166L204 188H46L24 166V84Z
                               M24 110H226V140H24Z
                               M125 110 140 125 125 140 110 125Z"/>
</svg>

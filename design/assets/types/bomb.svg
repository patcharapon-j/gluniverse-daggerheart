<!-- Bomb: a heavy round body with a carved seam, a short neck, and a fuse that
     leaves the top at an angle and tapers to a point with sparks.

     No stopper and a hard diagonal fuse are what keep it apart from potion.svg
     at 14px, where a round body alone is the same shape twice. The fuse starts
     inside the neck rather than at its lip, because a butt join there leaves a
     hairline of background between them.

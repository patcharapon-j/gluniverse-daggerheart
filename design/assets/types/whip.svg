<!-- Whip: one lash off a bound grip at the foot, swinging up and across and
     thinning the whole way to a cracked tip. Drawn, not traced. See
     art-src/marks/BRIEF.md.

     The lash never doubles back close enough to run beside itself. Coiled it
     read as a snake however blunt the end was, because a coil shows the same
     width twice and hides the taper. Kept to one open sweep, the eye crosses
     the whole width change from grip to crack in a single pass, and that pass
     is the mark. -->

<!-- Flintlock pistol. The cock hooking up off the breech is the only part that dates
     it, so it gets the longest taper in the mark even though a slide would read faster.
     There is no separate lock plate: an earlier pass gave the breech its own round mass
     and the mark turned into a hairdryer, so the lock is a deeper section of the barrel
     with the frizzen carved into it. Cock, guard and grip all root well inside the
     barrel, because a limb that only meets it at the edge breaks off at 24px.
     See art-src/marks/BRIEF.md. -->

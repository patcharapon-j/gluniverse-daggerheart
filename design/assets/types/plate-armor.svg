<!-- Plate armor: a cuirass with flaring pauldrons, a centre keel, a pointed hem.
     Drawn rather than traced, see art-src/marks/BRIEF.md.

     All five armor marks are a torso, so the silhouette has to say which cut
     before any interior detail arrives. This one owns the widest shoulder in
     the set and the only hem that comes to a point.

     Each pauldron is an ogee rather than a triangle. A triangle wide enough to
     have mass at the shoulder closed at nearly sixty degrees and read as a
     paddle, so the lower edge now swells away from the body in a curve and
     comes back almost level into the tip, which closes near thirty.

     The chest seams are vertical, not banded. Two nested chevrons across the
     waist looked right at full size and turned into a mouth at 24px, with the
     pauldrons as a hat brim above it. Running the seams down the keel and out
     to the hem kills that read and says ridged breastplate instead. -->

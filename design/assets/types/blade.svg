<!-- Blade: one upright sword, apex up, a fuller carved down the centre, a crossguard
     whose quillons taper out of the collar into two upswept points, and a faceted
     pommel with a boss knocked out of it. The non-obvious call was the waisted
     blade: straight sides made a triangle that read as an arrow at 14px, and the
     slight waist is what drives the tip to a point rather than a corner. The
     guard was also pulled in off the edges, because at full width it outweighed
     the blade and the whole mark read as a crescent.
     See ../../../art-src/marks/BRIEF.md. -->

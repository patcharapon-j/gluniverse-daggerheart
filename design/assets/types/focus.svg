<!-- Focus: an orb gripped in a three-talon claw, a crescent carved out of the
     sphere. Drawn, not traced. See art-src/marks/BRIEF.md.

     The talons stand ten units off the sphere and stop short of it rather than
     crossing it. Laid against it they welded into one egg and the orb stopped
     being round at all. The three are unequal, two rising at the sides and the
     third arching over the crown, because three even spikes around a centre is
     the arcana starburst, which sits on the same row. -->

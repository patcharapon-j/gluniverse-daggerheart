<!-- Transformation: one form caught turning into another.
     Drawn to art-src/marks/BRIEF.md.

     A single ribbon that leaves the foot heavy and smooth, carries through
     one turn and comes out the top as a point, with a shard already broken
     off ahead of it. Nothing about it mirrors, which is the point: every
     symmetric attempt at this subject grew two horns over a centred void
     and read as a beast's skull, which is both wrong and the `dread` domain
     sigil's own territory.

     The sliver carved inside the turn is what keeps the mass from reading
     as a solid comma. It follows the turn rather than cutting across it. -->

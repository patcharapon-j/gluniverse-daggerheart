<!-- Shard: three crystal splinters of uneven length off one base, facets cut as
     negative slivers.

     Each facet stops below the midpoint, because a sliver run to the tip
     hollows the splinter into an outline at 24px. Straight edges here on
     purpose, against the curved house style, because a crystal drawn with
     sweeps reads as a flame. The base is one path the three splinters sit on
     rather than three separate feet, so the group reads as one cluster.
     Construction rules: art-src/marks/BRIEF.md -->

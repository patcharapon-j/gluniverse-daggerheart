<!-- Garment: worn gear drawn as a single boot. Tall shaft with a carved cuff
     fold, two lace eyelets voided through it, sole carved as a band,
     tapering heel at the back.
     Drawn rather than traced, see art-src/marks/BRIEF.md.

     It must not read as armour, so the shaft is one soft curve pinched at
     the ankle, with no plates, no studs and no straight edges. The armour
     mark beside it is built from hard overlapping bands, and softness is
     the whole distinction.

     The cuff fold stops short of both sides. Carved the full width it cut
     the cuff loose and the top of the boot floated.

     The sole is the fill left under a carved slot rather than a bar laid
     along the bottom, and the slot ends before the heel so the heel stays
     part of the boot. -->

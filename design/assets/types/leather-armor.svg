<!-- Leather armor: a jerkin, laced, with a belt.
     Drawn to art-src/marks/BRIEF.md.

     The shoulders are square and the sleeves are stubs, which is the fix.
     Tapering shoulder straps read as ears and turned the whole mark into a
     hooded face, which is both wrong and `cloak`'s territory. Nothing above
     the chest line comes to a point now.

     The lace runs down a V cut out of the top edge rather than drawn on the
     chest, so it survives in silhouette. That is also what separates this
     from `cloth-armor`, whose opening is closed and whose read is the flare
     at the hem. -->

<!-- Three thrown blades in flight, three-fold rotation about an empty centre. Each
     blade is canted off its own spoke, which is what reads as spin; an earlier pass
     curved them much further round the circle to fill the square corners and they
     stopped being blades and turned into leaves. Count is the cue, so all three are
     drawn at one weight rather than stepped in size. The carved slot sits off the
     spine toward the thick back edge, because centred it left the straight leading
     edge a rim too thin to survive at 24px. See art-src/marks/BRIEF.md. -->

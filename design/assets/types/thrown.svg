<!-- Three thrown blades in flight, three-fold rotation about an empty centre. Each
     blade is canted off its own spoke, which is what reads as spin; an earlier pass
     curved them much further round the circle to fill the square corners and they
     stopped being blades and became leaves. Count is the cue, so all three are drawn
     at one weight rather than stepped in size. See art-src/marks/BRIEF.md. -->

<!-- Adventuring gear: a buckled pack, a carry loop over the top, a flap cut
     across the front and two straps bridging it. Drawn, not traced. See
     art-src/marks/BRIEF.md.

     The flap is not a shape laid over the bag, because two solid paths in one
     fill have no edge between them. It is a crescent knocked clean out through
     both sides of the body, so the flap is whatever sits above the cut and the
     gap is the only thing drawing it.

     The straps are full-length paths, invisible against the body everywhere
     except where they bridge that gap. Where they sit along it is the whole
     question. Out at the ends the cut reads as one long void with two ticks on
     it and no straps at all. Tight to the centre the middle piece shrinks to a
     rounded pill and reads as a second buckle. At a third of the way in, the
     cut breaks into three voids of roughly even length and the two bridges
     between them read as straps.

     The loop replaced two tapering tabs standing off the bag, which read as
     horns on a helm at every width tried. A limb with a hole in it is hardware
     and cannot read as a horn. It costs the taper the brief asks of a free
     limb, which a closed loop does not have.

     The buckle is three subpaths under evenodd: body, frame void, then the
     tongue filled back in inside it. One void alone would have been a dark
     square on the flap, which is a label rather than a fastening. -->

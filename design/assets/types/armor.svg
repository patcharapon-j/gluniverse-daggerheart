<!-- Armor: a cuirass seen front on, two pauldron flares, three banding grooves.
     Drawn, not traced. See art-src/marks/BRIEF.md.

     The pauldrons are separate paths overlapping the torso rather than part of
     its outline. Welded in, the shoulder line had to be one curve doing two
     jobs and the flare always lost. Overlapped, each sweeps out and tapers to
     its own point at the frame edge while the torso keeps a clean narrowing
     silhouette underneath it.

     Each point is a long shallow wedge, and the angle it closes at comes from
     where the two control handles sit rather than from the vertex. The first
     pass put the edges 90 degrees apart and got a paddle, the second got a
     horizontal spike. Both tips now rise toward the top of the frame, so the
     flare reads as a shoulder rather than a wing.

     The neckline is cut deep enough to be a neckline. At the shallow depth it
     started with it read as a dent in the top edge, and the mark lost its front
     on reading at 24px.

     Nothing here comes to a point below the shoulders. That is the whole
     separation from the two weapon marks, so the waist narrows to a round hem
     and the three grooves arc down with it rather than sitting level. -->

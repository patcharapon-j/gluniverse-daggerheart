<!-- Armor: three bands, tapering downward.
     Drawn on the set's shared grid — see art-src/types/GRID.md.

     Not a shield: the sheet already spends a shield on the Armor Score in the
     rail, and a second one here would claim the two are the same number when
     they are not. Not the equipment plate either, whose ring-and-core is the
     generic gear mark and has to stay free for items.

     Tapering is what keeps three stacked bars from reading as a menu icon — a
     stack that narrows is a torso, a stack that does not is a list. No points
     anywhere, which is the whole separation from the two weapon marks.
     Bands 46 deep at 32-unit gutters, widths 202, 166, 122. -->

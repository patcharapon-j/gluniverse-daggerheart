<!-- Consumable: a flask, stoppered, with a curl of vapour off the collar.
     Drawn rather than traced, see art-src/marks/BRIEF.md.

     The collar, the neck and the body are one continuous silhouette, and only
     the stopper is a separate path. An earlier pass had all three detached and
     at 14px the gaps closed up and the whole thing went back to being a blob,
     which is the failure the flat polygon version had in the first place.

     The carved level line sits low, where the body is widest. Higher up it
     crosses the shoulder, the carve narrows with the body, and it stops
     reading as liquid and starts reading as a crack in the glass.

     The body is widest around two thirds down and draws back in toward the
     base, so the silhouette tapers the way the domain marks' limbs do rather
     than sitting there as an oval.

     Vapour on the right only. It is the one asymmetry the brief allows here,
     and a mirrored pair stops being vapour and reads as a pair of handles. -->

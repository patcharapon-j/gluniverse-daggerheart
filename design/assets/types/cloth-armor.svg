<!-- Cloth armor: robes, narrow shoulder falling into a skirt that flares to the foot.
     Drawn rather than traced, see art-src/marks/BRIEF.md.

     The flare is the whole read, so it runs from a 50 unit shoulder to the full
     width of the frame at the hem and the two folds follow it rather than
     dropping straight. Nothing else in the set gets wider on the way down.

     The folds stop 25 units short of the hem. Run to the bottom edge they cut
     the skirt into three columns, and at 14px that is the ragged hem of
     cloak.svg, which is the one mark this must never be mistaken for.

     The sash sits high, at the narrow part of the body. Level with the waist it
     was swallowed by the flare and only the tail showed. -->

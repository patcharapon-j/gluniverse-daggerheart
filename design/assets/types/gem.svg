<!-- Gem: one cut stone face on. Table and crown above, girdle, pavilion
     tapering to a point at the bottom.
     Drawn rather than traced, see art-src/marks/BRIEF.md.

     Crown and pavilion are two separate shapes with the girdle as the air
     between them, rather than one outline with a facet line carved across
     it. A carved line that thin fills in at 14px, where a gap of twelve
     units still reads as the break in the stone.

     The two spurs at the girdle take the mark out to the live edge and put
     the widest point where a brilliant is actually widest, so they earn
     their place twice.

     The pavilion slots stop well short of the tip. Run all the way down they
     left a splinter of fill between them and the point went soft. -->

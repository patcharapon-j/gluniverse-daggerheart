<!-- Tome: a closed book at a slight angle. Spine down the left, cover with a
     hollowed boss, page block carved at the fore edge, two clasps.
     Drawn rather than traced, see art-src/marks/BRIEF.md.

     The codex domain sigil is an open book with flame off its pages, so this
     one has to be shut and fastened. The clasps are the whole distinction
     and they are therefore in the silhouette, two tongues protruding past
     the fore edge, not detail painted on the cover.

     The page block is three short slots rather than one long groove. A
     single groove beside the fore edge mirrored the spine groove and the
     book lost which edge it opened on.

     The boss is a void with its centre filled back in, three subpaths under
     evenodd. A plain void here was a dark diamond, which is a label. -->

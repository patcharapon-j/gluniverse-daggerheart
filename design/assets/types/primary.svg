<!-- Primary weapon: a leaf-bladed spearhead, two barbs off the shoulders, a
     bound collar running into a tang. Drawn, not traced. See the construction
     in art-src/marks/BRIEF.md.

     The mark has to narrow below its widest point, and that is the decision
     five drafts were spent finding. A rocket is a cone over fins that spread as
     they fall, and every version where the barbs swept down and out to the
     frame edge read as one, no matter how the barbs were tapered, notched or
     hooked. The barbs now reach the edge almost level with the blade shoulders
     and the tang falls away narrow beneath them, so the silhouette widens, then
     closes. Nothing that closes downward reads as a rocket.

     The barbs are separate paths laid over the blade rather than part of its
     outline. In the outline they could only continue the leaf's own sweep,
     which is how the rocket kept coming back.

     Each barb tip is shaped by its control handles rather than its vertex, both
     handles inboard of the point so the two edges arrive close to parallel.
     Vertices alone gave a lobe every time.

     Collar and tang are one path with the binding carved through it. Split in
     two they read as a pill and a stub, which is three objects stacked rather
     than a shaft with a wrap on it. -->

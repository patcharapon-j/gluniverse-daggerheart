<!-- Polearm: a halberd. A point above, a bit left, a hook right.
     Drawn to art-src/marks/BRIEF.md.

     Three things on one shaft, and the silhouette has to say three before
     it says anything else, because that is the only thing separating this
     from `axe` and `blade` at 14px. So the point clears the bit by a good
     margin rather than growing out of it, and the hook turns up on the
     opposite side at a different height.

     The shaft is thin for the same reason the axe's is. A broad shaft with
     a slab beside it is a flag, which is what the first passes drew. -->

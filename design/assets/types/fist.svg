<!-- Fist: an armoured gauntlet from the knuckle side, four lobes, the thumb a
     separate plate, a flared cuff. Drawn, not traced. See
     art-src/marks/BRIEF.md.

     The thumb is its own path standing nine units clear of the fingers
     rather than a seam carved into one mass. Carved, the seam filled in at
     14px and the hand went back to a mitten. As a gap it is the last piece of
     interior to close, so the thumb keeps reading as a thumb down to the chip
     size. -->

<!-- Dagger: a broad leaf blade opening at a far wider angle than blade.svg, the
     ricasso notched in from the widest point, a guard that sweeps down to two
     points, a wrapped grip and a blunt pommel. The non-obvious call was cutting
     the notch out of the outline instead of carving it as a hole: beside the
     sword the only thing separating the two at 14px is how wide the shoulders
     sit, and a hole leaves the silhouette unchanged. The guard sweeps down where
     the sword's sweeps up, so the pair never reads as one drawing at two scales.
     See ../../../art-src/marks/BRIEF.md. -->

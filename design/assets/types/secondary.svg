<!-- Secondary weapon: the same spearhead, twice.
     Drawn on the set's shared grid — see art-src/types/GRID.md.

     Count is what this family discriminates by once the archetype is spent —
     ancestry is two lozenges, community is three hexes — and it is the only
     cue that survives 14px whole. Two points is also the literal answer: the
     secondary slot is where a second weapon goes.

     Both are drawn at the same weight as each other rather than one shrunk
     against the other. The old pair put these at 56% of the primary so the
     two glyphs would differ in size as well as count, which only reads when
     both are on screen at once — and on a card only one ever is. At 70% of
     the primary they fill the same live area it does, which is what the grid
     asks of every mark. The 22-unit gutter is the family's floor. -->

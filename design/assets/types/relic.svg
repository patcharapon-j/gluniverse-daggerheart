<!-- Relic: a reliquary. Plinth, chambered body with an arched niche, a crown
     of three tapering spikes, tapering arms at the shoulders.
     Drawn rather than traced, see art-src/marks/BRIEF.md.

     The spike bases run down to y=100, well behind the body's top. Sitting
     them on the shoulder line left only sixteen units of each side spike
     showing, and at 24px the three of them closed into one bump.

     The arms are horizontal rather than swept. Swept back they turned the
     body and the niche into an aircraft, which is the one thing a reliquary
     must not look like, and horizontal arms read as a shrine instead.

     The base is a plinth with vertical sides, not a flared wedge. A wedge
     that wide and that shallow reads as the hill the object stands on. -->

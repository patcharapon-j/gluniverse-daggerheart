<!-- Community: three figures leaning in around a hearth.
     Drawn, not traced. See art-src/marks/BRIEF.md.

     This is the one mark in the set that turns instead of mirroring, because
     a gathering has no front. Three-fold rotation about the centre, so no
     arm is the odd one out.

     The arms are held apart, which is the decision that was not obvious. The
     sage sigil is a triskelion whose three spirals all meet at the hub, and
     at 14px a touching trio reads as one pinwheel. Here each arm is its own
     closed body with open ground between it and the next, and the core is a
     separate shape they lean toward but never reach, so the count survives
     the shrink. The carved eye in each head is what makes them figures. -->

<!-- Mail armor: a hauberk, standing collar, short sleeves, the weave carved out.
     Drawn rather than traced, see art-src/marks/BRIEF.md.

     Rounded everywhere plate is angular, so the two never trade places at a
     glance: the sleeves fall away from the shoulder instead of flaring up off
     it, and the hem is flat where plate comes to a point.

     The weave is a staggered field of lozenges, not rings. A ring needs a wall
     and a hole, and at 14px both close up and the torso goes solid grey. A
     lozenge is one void, holds its 18 by 12 at any size, and the stagger is
     what says woven rather than drilled.

     Each sleeve is its own path laid over the body. Welded into the outline the
     shoulder had to be one curve doing two jobs, and the cuff lost its taper,
     which is the same trade the pauldrons on armor.svg make. -->

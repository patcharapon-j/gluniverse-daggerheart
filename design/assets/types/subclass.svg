<!-- Subclass: one stem rising and splitting into two arms.
     Drawn to art-src/marks/BRIEF.md.

     The arms are unequal, and that is the fix rather than a flourish. Every
     symmetric version of this read as an animal's face: two upward limbs
     either side of a centred void is a pair of ears over a muzzle, and the
     eye finds that before it finds a fork. Dropping the right arm shorter
     and shallower than the left breaks the mirror, and with it the read.

     The right arm is also much the shorter of the two, which is doing a
     second job. `staff.svg` is a pole under a symmetric crown, and at 14px
     a symmetric fork on a stem is the same silhouette. Lopsided, this one
     cannot be mistaken for it.

     Stem and arms are three overlapping paths rather than one outline. Run
     as a single outline the two edges of an arm start a hand apart at the
     fork and converge all the way up, so the top half is a hairline that is
     gone at 14px. As its own shape an arm can be widest in its middle,
     which is where a limb carries, and spend the taper in the last third. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 250 250" fill="currentColor">
  <path fill-rule="evenodd" d="M101 232 L101 158 L149 158 L149 232 Z
    M125 178 L138 192 L125 206 L112 192 Z"/>
  <path d="M100 188 C 82 138 56 90 20 26 C 66 88 110 134 138 174 Z"/>
  <path d="M140 178 C 158 146 178 122 206 100 C 196 136 174 166 146 202 Z"/>
</svg>

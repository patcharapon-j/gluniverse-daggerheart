<!-- Dread. Traced from the mark in *Hope and Fear* rather than authored,
     which is what the other nine are and what this file was not.

     The supplied source is a 4x upscale of the book's own small raster, white
     on transparent — so the *alpha* channel is the shape and no colour keying
     is involved. Thresholded at 128 it resolves to exactly five components at
     every threshold from 64 to 190 (one body and two mirrored pairs) with no
     speckle anywhere, which is why there is no hand-cleaning step: the upscale
     was clean and the mask is the mark. Traced with potrace at alphaMax 1.0,
     because the figure is drawn with hard points and a smoothed corner would
     round the tines; refitted to 234 units on its long axis and centred, which
     is where grace (236), splendor (231) and valor (218) already sit.

     There is no committed tool for this, the way `tools/import-hf-art.mjs` is
     one for the paintings, because it ran once over one file and would carry
     two dev dependencies for it. The parameters are the reproducible part:
     alpha >= 128 to a bitmap, potrace at turdSize 40 / alphaMax 1.0 /
     optTolerance 0.2 / turnPolicy minority, then the refit above. Coordinates
     are rounded to 2dp — a fortieth of a unit, which at the ~14px a card's
     corner plate renders at is a third of a thousandth of a pixel. -->

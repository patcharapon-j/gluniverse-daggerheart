<!-- Brawler: impact. Two wedges driven at each other, meeting at a gap.
     Valor and Bone — the body as the weapon — and what a brawl is is two
     forces arriving at the same place, which is also what Combo Strike and the
     Juggernaut are about.

     This was four knuckles over a wrap. The idea was fine; the *composition*
     was taken. A row of shapes sitting on a solid base is Ranger's track and
     Guardian's battlement, and at the 14px a compendium row draws, three marks
     built the same way are one mark — measured as silhouette overlap at 32px
     it sat at .64 against Guardian in a set whose own median is .26.

     A fist was tried twice and fails for the reason the old note gave and a
     second pass confirmed: reduced to a chamfered silhouette it is a blob with
     a bite out of it, and the bite is the first thing to go. It scored .71,
     worse than what it replaced. So the mark is the gesture rather than the
     hand.

     The gap runs *across* and not down, and that is the whole of why this one
     works. Drawn on the other axis it is two masses either side of a vertical
     split, which is Wizard's open book and Guardian's crenellations — .68 and
     .61, no better than the knuckles. Turned ninety degrees the same figure
     falls to .47, and its next-worst is .37. Nothing else in the family reads
     as a horizontal seam.

     The 26-unit gap is the figure. It is the one part that has to survive, so
     it is wider than any gutter elsewhere in the set — at 14px it is a pixel
     and a half, and the flats either side of it are 38 units so the wedges
     meet the seam square rather than pinching to points that dissolve. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 250 250" fill="currentColor">
  <path d="M52 26 198 26 198 44 144 112 106 112 52 44Z"/>
  <path d="M52 224 198 224 198 206 144 138 106 138 52 206Z"/>
</svg>

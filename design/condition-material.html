<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DH · Production condition material</title>
<link rel="stylesheet" href="/design/tokens.css">
<link rel="stylesheet" href="/design/gem.css">
<link rel="stylesheet" href="/design/token.css">
<style>
html,body{min-height:100%;margin:0;background:#06080b;color:#e9eef4;font-family:var(--f-ui),sans-serif}
body{display:grid;place-items:center;background:
  radial-gradient(700px 480px at 76% 8%,rgba(83,119,155,.2),transparent 70%),
  linear-gradient(rgba(104,128,149,.055) 1px,transparent 1px),
  linear-gradient(90deg,rgba(104,128,149,.055) 1px,transparent 1px),#06080b;
  background-size:auto,64px 64px,64px 64px,auto}
main{width:min(1120px,calc(100% - 64px));padding:64px 0 76px}
header{display:flex;justify-content:space-between;align-items:end;gap:40px;margin-bottom:46px}
h1{margin:0;font-size:46px;line-height:.95;letter-spacing:-.05em;font-weight:620}
header p{max-width:410px;margin:0;color:#7e8a97;font-size:12px;line-height:1.65}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
article{min-height:420px;padding:5px;border-radius:30px;background:linear-gradient(145deg,rgba(176,202,229,.18),rgba(255,255,255,.025) 44%,rgba(96,113,136,.08));box-shadow:0 28px 74px rgba(0,0,0,.26)}
.card{height:100%;overflow:hidden;border-radius:25px;background:linear-gradient(155deg,#141a22,#080b10);box-shadow:inset 0 1px rgba(255,255,255,.055)}
.stage{position:relative;height:286px;display:grid;place-items:center;overflow:hidden;background:radial-gradient(170px 125px at 50% 45%,rgba(62,92,120,.28),transparent 70%),#090d12}
.stage::before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(104,128,149,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(104,128,149,.07) 1px,transparent 1px);background-size:100px 100px;background-position:center}
.runtime-token{position:relative;width:100px;height:100px;transform:scale(1.62);isolation:isolate;pointer-events:none}
.runtime-token canvas{position:absolute;z-index:1;inset:2px;width:96px;height:96px;border-radius:50%;filter:drop-shadow(0 10px 18px rgba(0,0,0,.6))}
.runtime-token>.tok{z-index:3;--tkv:1}
.copy{padding:22px 23px 25px}
.copy b{display:block;color:#f4f7fb;font-size:17px;letter-spacing:-.02em}.copy span{display:block;margin-top:10px;color:#74818e;font-size:10px;line-height:1.55}
.dead canvas{overflow:visible;border-radius:0;filter:drop-shadow(-3px 7px 7px rgba(0,0,0,.75))}
.dead .tok{opacity:1}
.qa{margin-top:24px;color:#64717e;font:650 9px/1.5 var(--f-mono),monospace;letter-spacing:.12em;text-transform:uppercase}
@media(max-width:840px){.grid{grid-template-columns:1fr}header{align-items:start;flex-direction:column}.stage{height:250px}}
</style>
</head>
<body><main>
  <header><h1>Production condition material</h1><p>The exact shipped shader and shipped token-chip markup, isolated for visual verification. No status icons. Every live material stays inside the circle; defeated replaces the system.</p></header>
  <section class="grid" id="runtime-grid"></section>
  <p class="qa" id="qa">Compiling production shader…</p>
</main><script type="module" src="/design/condition-material.js"></script></body>
</html>
